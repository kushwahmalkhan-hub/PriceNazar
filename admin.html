<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceNazar Admin</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Login */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: min(380px, calc(100% - 40px));
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .login-box h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .login-box h1 span { color: var(--primary); }

    .login-box p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      padding: 8px 14px;
      font-size: 13px;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    /* Admin Layout */
    .admin-screen { display: none; }

    .admin-header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .admin-header h1 {
      font-size: 20px;
    }

    .admin-header h1 span { color: var(--primary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .stat-card .num {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Section */
    .section-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-card h2 {
      font-size: 18px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    /* Add Product Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    /* Products Table */
    .products-table {
      width: 100%;
      border-collapse: collapse;
    }

    .products-table th {
      text-align: left;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .products-table td {
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .products-table tr:last-child td {
      border-bottom: none;
    }

    .products-table tr:hover td {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: #dbeafe;
      color: var(--primary);
    }

    .price-tag {
      font-weight: 700;
      color: var(--success);
    }

    .no-price {
      color: var(--muted);
      font-size: 12px;
    }

    .link-cell a {
      color: var(--primary);
      font-size: 12px;
      text-decoration: underline;
      word-break: break-all;
    }

    .td-actions {
      display: flex;
      gap: 8px;
    }

    .btn-edit {
      padding: 6px 12px;
      border: 1px solid var(--primary);
      border-radius: 7px;
      background: white;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      display: none;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 28px;
      width: min(520px, 100%);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      .products-table { font-size: 12px; }
      .admin-header h1 { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>Price<span>Nazar</span></h1>
      <p>Admin Panel — Login करें</p>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Admin password डालें">
      </div>

      <button class="btn btn-primary" onclick="doLogin()">Login करें</button>
      <p class="error-msg" id="loginError"></p>
    </div>
  </div>

  <!-- Admin Screen -->
  <div class="admin-screen" id="adminScreen">

    <header class="admin-header">
      <h1>Price<span>Nazar</span> Admin</h1>
      <div class="header-actions">
        <a href="/" target="_blank" class="btn btn-secondary">🌐 Site देखें</a>
        <button class="btn btn-secondary" onclick="doLogout()">Logout</button>
      </div>
    </header>

    <div class="admin-body">

      <!-- Stats -->
      <div class="stats">
        <div class="stat-card">
          <div class="num" id="statTotal">0</div>
          <div class="label">कुल Products</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statWithPrice">0</div>
          <div class="label">Price वाले</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statWithLink">0</div>
          <div class="label">Affiliate Link वाले</div>
        </div>
      </div>

      <!-- Add Product -->
      <div class="section-card">
        <h2>➕ नया Product Add करें</h2>

        <div class="form-grid">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="newName" placeholder="जैसे: Samsung Galaxy S24">
          </div>

          <div class="form-group">
            <label>Category *</label>
            <select id="newCategory">
              <option value="Smartphones">Smartphones</option>
              <option value="Laptops">Laptops</option>
              <option value="Smart TVs">Smart TVs</option>
              <option value="PC Parts">PC Parts</option>
              <option value="Accessories">Accessories</option>
              <option value="Tablets">Tablets</option>
              <option value="Smartwatches">Smartwatches</option>
            </select>
          </div>

          <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" id="newPrice" placeholder="जैसे: 74999">
          </div>

          <div class="form-group">
            <label>Emoji Icon</label>
            <input type="text" id="newImage" placeholder="📱" value="📱">
          </div>

          <div class="form-group full">
            <label>Description</label>
            <input type="text" id="newDescription" placeholder="जैसे: Samsung का flagship smartphone">
          </div>

          <div class="form-group full">
            <label>Amazon Affiliate Link</label>
            <input type="url" id="newAmazonLink" placeholder="https://amzn.to/...">
          </div>

          <div class="form-group full">
            <label>Flipkart Link (optional)</label>
            <input type="url" id="newFlipkartLink" placeholder="https://fkrt.it/...">
          </div>

          <div class="form-group full">
            <label>Search Terms (optional)</label>
            <input type="text" id="newSearchTerms" placeholder="samsung galaxy s24 samsung phone mobile">
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-success" onclick="addProduct()">✅ Product Add करें</button>
          <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
        </div>
      </div>

      <!-- Products List -->
      <div class="section-card">
        <h2>📦 सभी Products</h2>
        <div style="overflow-x:auto;">
          <table class="products-table" id="productsTable">
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Amazon Link</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Export -->
      <div class="section-card">
        <h2>📤 Export / Backup</h2>
        <p style="color:var(--muted);font-size:14px;margin-bottom:16px;">Products का backup लें या restore करें।</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="exportData()">⬇️ Backup Download करें</button>
          <label class="btn btn-secondary" style="cursor:pointer;">
            ⬆️ Backup Restore करें
            <input type="file" accept=".json" onchange="importData(event)" style="display:none;">
          </label>
        </div>
      </div>

    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>✏️ Product Edit करें</h2>

      <input type="hidden" id="editId">

      <div class="form-grid">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="editName">
        </div>

        <div class="form-group">
          <label>Category *</label>
          <select id="editCategory">
            <option value="Smartphones">Smartphones</option>
            <option value="Laptops">Laptops</option>
            <option value="Smart TVs">Smart TVs</option>
            <option value="PC Parts">PC Parts</option>
            <option value="Accessories">Accessories</option>
            <option value="Tablets">Tablets</option>
            <option value="Smartwatches">Smartwatches</option>
          </select>
        </div>

        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="editPrice">
        </div>

        <div class="form-group">
          <label>Emoji Icon</label>
          <input type="text" id="editImage">
        </div>

        <div class="form-group full">
          <label>Description</label>
          <input type="text" id="editDescription">
        </div>

        <div class="form-group full">
          <label>Amazon Affiliate Link</label>
          <input type="url" id="editAmazonLink">
        </div>

        <div class="form-group full">
          <label>Flipkart Link</label>
          <input type="url" id="editFlipkartLink">
        </div>

        <div class="form-group full">
          <label>Search Terms</label>
          <input type="text" id="editSearchTerms">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-success" onclick="saveEdit()">✅ Save करें</button>
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // =====================
    // Password
    // =====================
    var ADMIN_PASSWORD = "pricenazar123"; // यहाँ अपना password बदलें

    function doLogin() {
      var pass = document.getElementById("passwordInput").value;
      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem("pn_admin_auth", "true");
        showAdmin();
      } else {
        document.getElementById("loginError").textContent = "गलत password! फिर कोशिश करें।";
      }
    }

    document.getElementById("passwordInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });

    function doLogout() {
      localStorage.removeItem("pn_admin_auth");
      document.getElementById("adminScreen").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
    }

    function showAdmin() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminScreen").style.display = "block";
      renderTable();
      updateStats();
    }

    // Check if already logged in
    if (localStorage.getItem("pn_admin_auth") === "true") {
      showAdmin();
    }

    // =====================
    // Default Products
    // =====================
    var defaultProducts = [
      { id: 1, name: "Samsung Galaxy S Series", category: "Smartphones", description: "Samsung flagship smartphone", price: null, image: "📱", amazonLink: "", flipkartLink: "", searchTerms: "samsung galaxy s series samsung phone mobile" },
      { id: 2, name: "Apple iPhone", category: "Smartphones", description: "Apple smartphone", price: null, image: "📱", amazonLink: "", flipkartLink: "", searchTerms: "apple iphone ios mobile phone" },
      { id: 3, name: "OnePlus Smartphone", category: "Smartphones", description: "OnePlus Android smartphone", price: null, image: "📱", amazonLink: "", flipkartLink: "", searchTerms: "oneplus android smartphone mobile" },
      { id: 4, name: "Gaming Laptop", category: "Laptops", description: "Laptop for gaming and performance", price: null, image: "💻", amazonLink: "", flipkartLink: "", searchTerms: "gaming laptop notebook" },
      { id: 5, name: "Thin and Light Laptop", category: "Laptops", description: "Portable laptop for everyday use", price: null, image: "💻", amazonLink: "", flipkartLink: "", searchTerms: "thin light laptop portable" },
      { id: 6, name: "Smart LED TV", category: "Smart TVs", description: "Smart television", price: null, image: "📺", amazonLink: "", flipkartLink: "", searchTerms: "smart tv television led" },
      { id: 7, name: "Gaming Graphics Card", category: "PC Parts", description: "Graphics card for gaming PCs", price: null, image: "🎮", amazonLink: "", flipkartLink: "", searchTerms: "graphics card gpu nvidia amd" },
      { id: 8, name: "Desktop Processor", category: "PC Parts", description: "CPU for desktop computers", price: null, image: "🖥️", amazonLink: "", flipkartLink: "", searchTerms: "processor cpu intel amd" },
      { id: 9, name: "DDR5 RAM", category: "PC Parts", description: "Desktop memory", price: null, image: "💾", amazonLink: "", flipkartLink: "", searchTerms: "ddr5 ram memory" },
      { id: 10, name: "Wireless Headphones", category: "Accessories", description: "Wireless audio headphones", price: null, image: "🎧", amazonLink: "", flipkartLink: "", searchTerms: "wireless headphones audio" },
      { id: 11, name: "Bluetooth Earbuds", category: "Accessories", description: "True wireless earbuds", price: null, image: "🎵", amazonLink: "", flipkartLink: "", searchTerms: "bluetooth earbuds tws" },
      { id: 12, name: "Android Tablet", category: "Tablets", description: "Tablet for study and entertainment", price: null, image: "📟", amazonLink: "", flipkartLink: "", searchTerms: "android tablet tab" },
      { id: 13, name: "Smartwatch", category: "Smartwatches", description: "Smart wearable watch", price: null, image: "⌚", amazonLink: "", flipkartLink: "", searchTerms: "smartwatch wearable" },
      { id: 14, name: "Portable SSD", category: "PC Parts", description: "External solid state drive", price: null, image: "💽", amazonLink: "", flipkartLink: "", searchTerms: "portable ssd external storage" },
      { id: 15, name: "Wireless Keyboard", category: "Accessories", description: "Wireless computer keyboard", price: null, image: "⌨️", amazonLink: "", flipkartLink: "", searchTerms: "wireless keyboard" },
      { id: 16, name: "Gaming Mouse", category: "Accessories", description: "Mouse for gaming", price: null, image: "🖱️", amazonLink: "", flipkartLink: "", searchTerms: "gaming mouse" }
    ];

    // =====================
    // Data Functions
    // =====================
    function getProducts() {
      var stored = localStorage.getItem("pn_products");
      if (stored) return JSON.parse(stored);
      localStorage.setItem("pn_products", JSON.stringify(defaultProducts));
      return defaultProducts;
    }

    function saveProducts(products) {
      localStorage.setItem("pn_products", JSON.stringify(products));
    }

    function getNextId() {
      var products = getProducts();
      if (!products.length) return 1;
      return Math.max.apply(null, products.map(function(p) { return p.id; })) + 1;
    }

    // =====================
    // Add Product
    // =====================
    function addProduct() {
      var name = document.getElementById("newName").value.trim();
      var category = document.getElementById("newCategory").value;
      var price = document.getElementById("newPrice").value;
      var image = document.getElementById("newImage").value.trim() || "📱";
      var description = document.getElementById("newDescription").value.trim();
      var amazonLink = document.getElementById("newAmazonLink").value.trim();
      var flipkartLink = document.getElementById("newFlipkartLink").value.trim();
      var searchTerms = document.getElementById("newSearchTerms").value.trim();

      if (!name) {
        showToast("Product Name ज़रूरी है!", true);
        return;
      }

      var products = getProducts();
      products.push({
        id: getNextId(),
        name: name,
        category: category,
        description: description || category + " product",
        price: price ? Number(price) : null,
        image: image,
        amazonLink: amazonLink,
        flipkartLink: flipkartLink,
        searchTerms: searchTerms || name.toLowerCase()
      });

      saveProducts(products);
      clearForm();
      renderTable();
      updateStats();
      showToast("Product add हो गया! ✅");
    }

    function clearForm() {
      document.getElementById("newName").value = "";
      document.getElementById("newPrice").value = "";
      document.getElementById("newImage").value = "📱";
      document.getElementById("newDescription").value = "";
      document.getElementById("newAmazonLink").value = "";
      document.getElementById("newFlipkartLink").value = "";
      document.getElementById("newSearchTerms").value = "";
    }

    // =====================
    // Delete Product
    // =====================
    function deleteProduct(id) {
      if (!confirm("यह product delete करना चाहते हैं?")) return;
      var products = getProducts().filter(function(p) { return p.id !== id; });
      saveProducts(products);
      renderTable();
      updateStats();
      showToast("Product delete हो गया!");
    }

    // =====================
    // Edit Product
    // =====================
    function openEdit(id) {
      var product = getProducts().find(function(p) { return p.id === id; });
      if (!product) return;

      document.getElementById("editId").value = id;
      document.getElementById("editName").value = product.name;
      document.getElementById("editCategory").value = product.category;
      document.getElementById("editPrice").value = product.price || "";
      document.getElementById("editImage").value = product.image;
      document.getElementById("editDescription").value = product.description;
      document.getElementById("editAmazonLink").value = product.amazonLink || "";
      document.getElementById("editFlipkartLink").value = product.flipkartLink || "";
      document.getElementById("editSearchTerms").value = product.searchTerms || "";

      document.getElementById("editModal").style.display = "flex";
    }

    function saveEdit() {
      var id = Number(document.getElementById("editId").value);
      var products = getProducts();
      var index = products.findIndex(function(p) { return p.id === id; });
      if (index === -1) return;

      var price = document.getElementById("editPrice").value;

      products[index] = {
        id: id,
        name: document.getElementById("editName").value.trim(),
        category: document.getElementById("editCategory").value,
        description: document.getElementById("editDescription").value.trim(),
        price: price ? Number(price) : null,
        image: document.getElementById("editImage").value.trim() || "📱",
        amazonLink: document.getElementById("editAmazonLink").value.trim(),
        flipkartLink: document.getElementById("editFlipkartLink").value.trim(),
        searchTerms: document.getElementById("editSearchTerms").value.trim()
      };

      saveProducts(products);
      closeModal();
      renderTable();
      updateStats();
      showToast("Product update हो गया! ✅");
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
    }

    document.getElementById("editModal").addEventListener("click", function(e) {
      if (e.target === this) closeModal();
    });

    // =====================
    // Render Table
    // =====================
    function renderTable() {
      var products = getProducts();
      var tbody = document.getElementById("productsTableBody");

      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">कोई product नहीं है।</td></tr>';
        return;
      }

      tbody.innerHTML = products.map(function(p) {
        var priceHtml = p.price
          ? '<span class="price-tag">₹' + p.price.toLocaleString("en-IN") + '</span>'
          : '<span class="no-price">Set नहीं</span>';

        var linkHtml = p.amazonLink
          ? '<a href="' + p.amazonLink + '" target="_blank">Link ✓</a>'
          : '<span class="no-price">नहीं है</span>';

        return '<tr>'
          + '<td>' + p.image + ' <strong>' + p.name + '</strong></td>'
          + '<td><span class="badge">' + p.category + '</span></td>'
          + '<td>' + priceHtml + '</td>'
          + '<td class="link-cell">' + linkHtml + '</td>'
          + '<td><div class="td-actions">'
          + '<button class="btn-edit" onclick="openEdit(' + p.id + ')">✏️ Edit</button>'
          + '<button class="btn btn-danger" onclick="deleteProduct(' + p.id + ')">🗑️</button>'
          + '</div></td>'
          + '</tr>';
      }).join("");
    }

    // =====================
    // Stats
    // =====================
    function updateStats() {
      var products = getProducts();
      document.getElementById("statTotal").textContent = products.length;
      document.getElementById("statWithPrice").textContent = products.filter(function(p) { return p.price; }).length;
      document.getElementById("statWithLink").textContent = products.filter(function(p) { return p.amazonLink; }).length;
    }

    // =====================
    // Export / Import
    // =====================
    function exportData() {
      var data = JSON.stringify(getProducts(), null, 2);
      var blob = new Blob([data], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "pricenazar-backup.json";
      a.click();
      showToast("Backup download हो गया! ✅");
    }

    function importData(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error("Invalid");
          saveProducts(data);
          renderTable();
          updateStats();
          showToast("Backup restore हो गया! ✅");
        } catch(err) {
          showToast("गलत file! JSON file चाहिए।", true);
        }
      };
      reader.readAsText(file);
    }

    // =====================
    // Toast
    // =====================
    function showToast(msg, isError) {
      var toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.background = isError ? "#dc2626" : "#16a34a";
      toast.style.display = "block";
      setTimeout(function() { toast.style.display = "none"; }, 3000);
    }
  </script>
</body>
</html>
