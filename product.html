<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product Details - PriceNazar</title>
  <meta name="description" content="PriceNazar पर product की full details, specs और price history देखें।">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#3b82f6">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pd-wrap { max-width: 900px; margin: 24px auto 60px; padding: 0 16px; }
    .pd-back { display: inline-block; margin-bottom: 14px; font-weight: 700; font-size: 14px; color: #2563eb; text-decoration: none; }
    .pd-card { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 16px; padding: 22px; margin-bottom: 18px; }
    .pd-card h2 { font-size: 18px; margin-bottom: 14px; color: #0f172a; }
    .pd-top { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .pd-emoji { font-size: 72px; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 16px; flex-shrink: 0; }
    .pd-info { flex: 1; min-width: 220px; }
    .pd-cat { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; background: #dbeafe; color: #2563eb; }
    .pd-name { font-size: 24px; line-height: 1.3; margin: 8px 0; color: #0f172a; }
    .pd-desc { color: #64748b; font-size: 14px; margin-bottom: 10px; }
    .pd-rating { color: #f59e0b; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .pd-rating span { color: #64748b; font-size: 13px; margin-left: 6px; }
    .pd-price { font-size: 32px; font-weight: 800; color: #16a34a; }
    .pd-change { margin-top: 6px; font-size: 14px; font-weight: 700; }
    .pd-change.down { color: #16a34a; }
    .pd-change.up { color: #dc2626; }
    .pd-lowest { margin-top: 4px; font-size: 13px; color: #64748b; }
    .pd-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .pd-actions a { flex: 1; min-width: 140px; text-align: center; text-decoration: none; }
    .pd-note { margin-top: 12px; font-size: 12px; color: #64748b; }
    .pd-specs { width: 100%; border-collapse: collapse; }
    .pd-specs th { text-align: left; width: 38%; padding: 11px 12px; font-size: 13px; color: #64748b; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .pd-specs td { padding: 11px 12px; font-size: 14px; border-bottom: 1px solid #e2e8f0; color: #0f172a; }
    .pd-empty { color: #64748b; font-size: 14px; }
    .pd-chart { width: 100%; height: auto; display: block; }
    .pd-state { text-align: center; padding: 60px 16px; color: #64748b; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Price<span>Nazar</span></a>
      <nav class="main-nav" id="mainNav">
        <a href="/#home">Home</a>
        <a href="/#categories">Categories</a>
        <a href="/#products">Products</a>
        <a href="/#compare">Compare</a>
      </nav>
    </div>
  </header>

  <main class="pd-wrap">
    <a class="pd-back" href="/#products">← सभी Products</a>
    <div id="pdRoot"><div class="pd-state">Loading...</div></div>
  </main>

  <script>
    var SUPABASE_URL = "https://fpkkyppdhkngkktkrbji.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_ib6fxqUCmPPGcJZE0Yqo3A_9Y8pUSXM";
    var AMAZON_TAG = "pricenazar02-21";

    var SPEC_LABELS = [
      ["display", "Display"], ["processor", "Processor"], ["ram", "RAM"], ["storage", "Storage"],
      ["camera", "Camera"], ["battery", "Battery"], ["charging", "Charging"]
    ];

    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function safeUrl(u) {
      u = String(u || "").trim();
      return /^https?:\/\//i.test(u) ? u : "";
    }
    function money(n) {
      return "₹" + Number(n).toLocaleString("en-IN");
    }
    function shortDate(iso) {
      var d = new Date(iso);
      return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    }
    function headers() {
      var h = { apikey: SUPABASE_ANON_KEY };
      if (SUPABASE_ANON_KEY.indexOf("eyJ") === 0) h.Authorization = "Bearer " + SUPABASE_ANON_KEY;
      return h;
    }
    function get(path) {
      return fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: headers() }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    }

    function stars(rating) {
      var full = Math.round(rating);
      var out = "";
      for (var i = 1; i <= 5; i++) out += i <= full ? "★" : "☆";
      return out;
    }

    function chartSvg(points) {
      var W = 600, H = 220, padL = 56, padR = 16, padT = 16, padB = 34;
      var prices = points.map(function (p) { return Number(p.price); });
      var min = Math.min.apply(null, prices), max = Math.max.apply(null, prices);
      if (min === max) { min = min * 0.95; max = max * 1.05; }
      var t0 = new Date(points[0].recorded_at).getTime();
      var t1 = new Date(points[points.length - 1].recorded_at).getTime();
      function x(i, t) {
        if (t1 === t0) return padL + (W - padL - padR) * (points.length === 1 ? 0.5 : i / (points.length - 1));
        return padL + (W - padL - padR) * ((t - t0) / (t1 - t0));
      }
      function y(v) { return padT + (H - padT - padB) * (1 - (v - min) / (max - min)); }

      var coords = points.map(function (p, i) {
        return [x(i, new Date(p.recorded_at).getTime()), y(Number(p.price))];
      });
      var line = coords.map(function (c) { return c[0].toFixed(1) + "," + c[1].toFixed(1); }).join(" ");
      var dots = coords.map(function (c) {
        return '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="4" fill="#2563eb"/>';
      }).join("");
      var last = coords[coords.length - 1];

      return '<svg class="pd-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Price history graph">'
        + '<line x1="' + padL + '" y1="' + y(max) + '" x2="' + (W - padR) + '" y2="' + y(max) + '" stroke="#e2e8f0"/>'
        + '<line x1="' + padL + '" y1="' + y(min) + '" x2="' + (W - padR) + '" y2="' + y(min) + '" stroke="#e2e8f0"/>'
        + '<text x="' + (padL - 8) + '" y="' + (y(max) + 4) + '" font-size="11" fill="#64748b" text-anchor="end">' + money(Math.round(max)) + '</text>'
        + '<text x="' + (padL - 8) + '" y="' + (y(min) + 4) + '" font-size="11" fill="#64748b" text-anchor="end">' + money(Math.round(min)) + '</text>'
        + '<polyline points="' + line + '" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>'
        + dots
        + '<text x="' + padL + '" y="' + (H - 10) + '" font-size="11" fill="#64748b">' + shortDate(points[0].recorded_at) + '</text>'
        + '<text x="' + (W - padR) + '" y="' + (H - 10) + '" font-size="11" fill="#64748b" text-anchor="end">' + shortDate(points[points.length - 1].recorded_at) + '</text>'
        + '</svg>';
    }

    function render(p, history) {
      var amazon = safeUrl(p.amazon_link) || ("https://www.amazon.in/s?k=" + encodeURIComponent(p.name) + "&tag=" + AMAZON_TAG);
      var flipkart = safeUrl(p.flipkart_link) || ("https://www.flipkart.com/search?q=" + encodeURIComponent(p.name));
      var price = p.price == null ? null : Number(p.price);

      document.title = p.name + " - Price, Specs & Price History | PriceNazar";
      var md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute("content", p.name + " की price history, specs और Amazon व Flipkart पर best price PriceNazar पर देखें।");

      var ratingHtml = p.rating != null
        ? '<div class="pd-rating">' + stars(Number(p.rating)) + '<span>' + Number(p.rating).toFixed(1) + ' / 5</span></div>' : "";

      var changeHtml = "";
      var lowestHtml = "";
      if (history.length >= 2 && price != null) {
        var prev = null;
        for (var i = history.length - 1; i >= 0; i--) {
          if (Number(history[i].price) !== price) { prev = Number(history[i].price); break; }
        }
        if (prev != null) {
          var diff = price - prev;
          var pct = Math.abs(Math.round((diff / prev) * 100));
          changeHtml = '<div class="pd-change ' + (diff < 0 ? "down" : "up") + '">पहले ' + money(prev) + ' → अब ' + money(price)
            + ' (' + (diff < 0 ? "▼ " : "▲ ") + pct + '% ' + (diff < 0 ? "सस्ता" : "महँगा") + ')</div>';
        }
        var lowest = Math.min.apply(null, history.map(function (h) { return Number(h.price); }));
        lowestHtml = '<div class="pd-lowest">अब तक का सबसे कम भाव: ' + money(lowest) + '</div>';
      }

      var specRows = SPEC_LABELS.filter(function (s) { return p.specs && p.specs[s[0]]; }).map(function (s) {
        return '<tr><th>' + s[1] + '</th><td>' + esc(p.specs[s[0]]) + '</td></tr>';
      }).join("");
      var specsHtml = specRows
        ? '<table class="pd-specs"><tbody>' + specRows + '</tbody></table>'
        : '<p class="pd-empty">इस product की specs जल्द जोड़ी जाएँगी। पूरी जानकारी के लिए नीचे Amazon या Flipkart देखें।</p>';

      var chartHtml;
      if (history.length >= 2) {
        chartHtml = chartSvg(history);
      } else {
        chartHtml = '<p class="pd-empty">' + (history.length === 1
          ? 'इस product की कीमत अभी से ट्रैक होना शुरू हुई है। कीमत बदलते ही यहाँ graph दिखेगा।'
          : 'अभी इस product की कीमत सेट नहीं है, इसलिए history उपलब्ध नहीं है।') + '</p>';
      }

      document.getElementById("pdRoot").innerHTML =
        '<div class="pd-card"><div class="pd-top">'
        + '<div class="pd-emoji">' + esc(p.image || "📦") + '</div>'
        + '<div class="pd-info">'
        + '<span class="pd-cat">' + esc(p.category) + '</span>'
        + '<h1 class="pd-name">' + esc(p.name) + '</h1>'
        + '<p class="pd-desc">' + esc(p.description) + '</p>'
        + ratingHtml
        + '<div class="pd-price">' + (price == null ? "Check store" : money(price)) + '</div>'
        + changeHtml + lowestHtml
        + '</div></div>'
        + '<div class="pd-actions">'
        + '<a class="primary-btn store-link" href="' + esc(amazon) + '" target="_blank" rel="noopener noreferrer">Amazon पर देखें</a>'
        + '<a class="secondary-btn store-link" href="' + esc(flipkart) + '" target="_blank" rel="noopener noreferrer">Flipkart पर देखें</a>'
        + '</div>'
        + '<p class="pd-note">Price may vary by store. As an Amazon Associate we earn from qualifying purchases.</p>'
        + '</div>'
        + '<div class="pd-card"><h2>Specifications</h2>' + specsHtml + '</div>'
        + '<div class="pd-card"><h2>📈 Price History</h2>' + chartHtml + '</div>';
    }

    (function init() {
      var id = parseInt(new URLSearchParams(location.search).get("id"), 10);
      var root = document.getElementById("pdRoot");
      if (!id) {
        root.innerHTML = '<div class="pd-state">Product नहीं मिला। <a href="/#products">सभी products देखें</a></div>';
        return;
      }
      var cols = "id,name,category,description,price,image,amazon_link,flipkart_link,specs,rating";
      Promise.all([
        get("products?id=eq." + id + "&select=" + cols),
        get("product_price_history?product_id=eq." + id + "&select=price,recorded_at&order=recorded_at.asc&limit=200")
          .catch(function () { return []; })
      ]).then(function (res) {
        if (!res[0].length) {
          root.innerHTML = '<div class="pd-state">Product नहीं मिला। <a href="/#products">सभी products देखें</a></div>';
          return;
        }
        render(res[0][0], res[1]);
      }).catch(function (err) {
        root.innerHTML = '<div class="pd-state">Product लोड नहीं हो पाया (' + esc(err.message) + '). थोड़ी देर बाद फिर कोशिश करें।</div>';
      });
    })();
  </script>

  <script type="text/javascript">
    var cId = '325209';
    (function(d, t) {
      var s = document.createElement('script');
      s.type = 'text/javascript';
      s.async = true;
      s.src = (document.location.protocol == 'https:' ? 'https://cdn0.cuelinks.com/js/' : 'http://cdn0.cuelinks.com/js/') + 'cuelinksv2.js';
      document.getElementsByTagName('body')[0].appendChild(s);
    }());
  </script>
</body>
</html>
